<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Calle y banqueta · Entorno VR con A-Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    #ui {
      position: fixed; left: 14px; top: 14px; z-index: 20;
      font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.55;
      color: #fff; background: rgba(12, 24, 40, .6);
      padding: 10px 14px; border-radius: 12px;
      pointer-events: none; backdrop-filter: blur(4px);
    }
    #ui b { color: #ffd166; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Calle &amp; Banqueta</b> · WASD o flechas: caminar · Arrastra con el mouse para mirar ·
    En gafas VR usa el botón morado "VR" abajo a la derecha.
  </div>

<script>
/* ===================== Texturas procedurales (canvas) ===================== */
(function () {
  const DRAW = {
    asphalt(g, w, h) {
      g.fillStyle = '#33363b'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 9000; i++) {
        g.fillStyle = Math.random() < 0.5
          ? 'rgba(255,255,255,' + (Math.random() * 0.05) + ')'
          : 'rgba(0,0,0,' + (Math.random() * 0.25) + ')';
        g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
      }
      for (let i = 0; i < 6; i++) {
        g.fillStyle = 'rgba(0,0,0,0.06)';
        g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 20 + Math.random() * 45, 0, 7); g.fill();
      }
    },
    tiles(g, w, h) { /* loseta de banqueta 2x2 (losa de ~50 cm) */
      g.fillStyle = '#b3ab9e'; g.fillRect(0, 0, w, h);
      const s = w / 2;
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
        g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '255,255,255' : '0,0,0') + ',' + (Math.random() * 0.09) + ')';
        g.fillRect(i * s, j * s, s, s);
      }
      g.strokeStyle = 'rgba(70,64,55,0.85)'; g.lineWidth = 3;
      for (let i = 0; i <= 2; i++) {
        g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke();
        g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke();
      }
      for (let i = 0; i < 700; i++) {
        g.fillStyle = 'rgba(0,0,0,' + Math.random() * 0.05 + ')';
        g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
      }
    },
    concrete(g, w, h) {
      g.fillStyle = '#a8a396'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 4000; i++) {
        g.fillStyle = 'rgba(0,0,0,' + Math.random() * 0.08 + ')';
        g.fillRect(Math.random() * w, Math.random() * h, 1, 2);
      }
      for (let i = 0; i < 20; i++) {
        g.fillStyle = 'rgba(255,255,255,' + Math.random() * 0.05 + ')';
        g.fillRect(0, Math.random() * h, w, 1);
      }
    },
    brick(g, w, h) {
      g.fillStyle = '#cfc5b6'; g.fillRect(0, 0, w, h);
      const bh = 26, bw = 62, cols = ['#9a5741', '#8d4e3a', '#a35e46', '#94533d'];
      for (let r = 0; r * bh < h; r++) {
        const off = (r % 2) * bw / 2;
        for (let c = -1; c * bw < w + bw; c++) {
          g.fillStyle = cols[(Math.random() * cols.length) | 0];
          g.fillRect(c * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
        }
      }
      for (let i = 0; i < 2500; i++) {
        g.fillStyle = 'rgba(0,0,0,' + Math.random() * 0.06 + ')';
        g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
      }
    },
    windows(g, w, h) {
      g.fillStyle = '#b9b2a6'; g.fillRect(0, 0, w, h);
      const cx = 4, cy = 4, cw = w / cx, ch = h / cy;
      for (let i = 0; i < cx; i++) for (let j = 0; j < cy; j++) {
        const x = i * cw, y = j * ch;
        g.fillStyle = '#6b675f';
        g.fillRect(x + cw * 0.2 - 3, y + ch * 0.18 - 3, cw * 0.6 + 6, ch * 0.55 + 6);
        const lit = Math.random() < 0.22;
        g.fillStyle = lit ? '#ffd98a' : (Math.random() < 0.5 ? '#41525f' : '#54707f');
        g.fillRect(x + cw * 0.2, y + ch * 0.18, cw * 0.6, ch * 0.55);
        g.fillStyle = 'rgba(255,255,255,0.18)';
        g.fillRect(x + cw * 0.2, y + ch * 0.18, cw * 0.6, ch * 0.08);
        g.fillStyle = 'rgba(0,0,0,0.25)';
        g.fillRect(x + cw * 0.2 - 3, y + ch * 0.73 + 3, cw * 0.6 + 6, 4);
      }
      for (let i = 0; i < 3000; i++) {
        g.fillStyle = 'rgba(0,0,0,' + Math.random() * 0.05 + ')';
        g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
      }
    },
    grass(g, w, h) {
      g.fillStyle = '#6f9b4e'; g.fillRect(0, 0, w, h);
      const gs = ['#7fae5c', '#628c44', '#83b262', '#587e3e'];
      for (let i = 0; i < 12000; i++) {
        g.fillStyle = gs[(Math.random() * gs.length) | 0];
        g.globalAlpha = Math.random() * 0.5;
        g.fillRect(Math.random() * w, Math.random() * h, 1, 2 + Math.random() * 3);
      }
      g.globalAlpha = 1;
    }
  };
  const cache = {};
  window.canvasFor = function (t) {
    if (cache[t]) return cache[t];
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    DRAW[t](c.getContext('2d'), 512, 512);
    cache[t] = c;
    return c;
  };
})();

/* Componente: aplica textura procedural con repetición (vía material de THREE) */
AFRAME.registerComponent('tex', {
  schema: { t: { default: 'asphalt' }, rx: { default: 1 }, ry: { default: 1 } },
  init() {
    this.applyTex = this.applyTex.bind(this);
    if (this.el.hasLoaded) this.applyTex();
    else this.el.addEventListener('loaded', this.applyTex);
  },
  applyTex() {
    const el = this.el, d = this.data;
    const setMap = () => {
      const mesh = el.getObject3D('mesh');
      if (!mesh || !mesh.material) return;
      const t = new THREE.CanvasTexture(window.canvasFor(d.t));
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(d.rx, d.ry);
      if (THREE.SRGBColorSpace !== undefined) t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      mesh.material.map = t;
      mesh.material.needsUpdate = true;
    };
    if (el.getObject3D('mesh')) setMap();
    else el.addEventListener('object3dset', (e) => { if (e.detail.type === 'mesh') setMap(); });
  }
});

/* Componente: genera los elementos repetitivos (farolas, árboles, paso peatonal) */
AFRAME.registerComponent('build-street', {
  init() {
    const sc = this.el;
    const mk = (tag, attrs) => {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    };

    /* Paso peatonal (cebras) */
    for (let i = 0; i < 7; i++) {
      sc.appendChild(mk('a-plane', {
        rotation: '-90 0 0', position: (-3.1 + i * 1.0333) + ' 0.03 -9',
        width: '0.55', height: '3', color: '#e8e6df'
      }));
    }

    /* Farolas */
    const addLamp = (x, z) => {
      const g = mk('a-entity', { position: x + ' 0 ' + z, 'cast-shadow': 'true' });
      g.appendChild(mk('a-cylinder', { radius: '0.07', height: '4.6', position: '0 2.3 0', color: '#3a4046' }));
      g.appendChild(mk('a-cylinder', { radius: '0.16', height: '0.3', position: '0 0.15 0', color: '#2e3338' }));
      g.appendChild(mk('a-box', { width: '2.4', height: '0.09', depth: '0.09', position: '-1.2 4.62 0', color: '#3a4046' }));
      g.appendChild(mk('a-box', { width: '0.55', height: '0.13', depth: '0.2', position: '-2.35 4.57 0', color: '#2e3338' }));
      g.appendChild(mk('a-sphere', { radius: '0.1', position: '-2.35 4.47 0', material: 'color: #fff6d8; emissive: #fff2c0; emissiveIntensity: 0.9' }));
      sc.appendChild(g);
    };
    [-24, -12, 0, 12, 24].forEach(z => addLamp(4.1, z));

    /* Árboles (en banqueta y en la glorieta verde del lado izquierdo) */
    const addTree = (x, z) => {
      const g = mk('a-entity', { position: x + ' 0 ' + z, 'cast-shadow': 'true' });
      g.appendChild(mk('a-cylinder', { radius: '0.14', height: '1.7', position: '0 0.85 0', color: '#6b4a2f' }));
      g.appendChild(mk('a-sphere', { radius: '0.95', position: '0 2.5 0', color: '#4e7a38' }));
      g.appendChild(mk('a-sphere', { radius: '0.7', position: '0.55 2.0 0.2', color: '#5b8a40' }));
      g.appendChild(mk('a-sphere', { radius: '0.65', position: '-0.5 2.15 -0.25', color: '#436d30' }));
      g.appendChild(mk('a-circle', { radius: '0.55', rotation: '-90 0 0', position: '0 ' + this.dirtY + ' 0', color: '#3d3126' }));
      sc.appendChild(g);
    };
    const self = this;
    [[6.6, -16, 0.152], [6.6, 14, 0.152], [-6, -15, 0.02], [-6, -2, 0.02], [-6, 12, 0.02]].forEach(function (p) {
      self.dirtY = p[2]; addTree(p[0], p[1]);
    });

    /* Rejilla de drenaje junto a la guarnición */
    const addDrain = (x, z) => {
      const g = mk('a-entity', { position: x + ' 0 ' + z, 'cast-shadow': 'true' });
      g.appendChild(mk('a-box', { width: '0.5', height: '0.03', depth: '1.4', position: '0 0.03 0', color: '#22262a' }));
      for (let i = 0; i < 6; i++) {
        g.appendChild(mk('a-box', { width: '0.46', height: '0.035', depth: '0.09', position: '0 0.032 ' + (-0.55 + i * 0.22), color: '#565b61' }));
      }
      sc.appendChild(g);
    };
    addDrain(3.15, 7);
  }
});
</script>

<a-scene shadow="type: pcfsoft"
         fog="type: linear; color: #d8ecfa; near: 28; far: 95"
         renderer="antialias: true; colorManagement: true"
         build-street>

  <a-sky color="#9fd0f0"></a-sky>

  <!-- ============ Luces ============ -->
  <a-light type="hemisphere" intensity="0.75" color="#cfe4ff" groundColor="#8a7f66"></a-light>
  <a-light type="directional" intensity="1.05" color="#fff4de" position="25 35 12" cast-shadow="true"
           shadow-map-width="2048" shadow-map-height="2048"
           shadow-camera-left="-35" shadow-camera-right="35"
           shadow-camera-top="35" shadow-camera-bottom="-35"></a-light>

  <!-- ============ Terreno base ============ -->
  <a-plane rotation="-90 0 0" width="220" height="220" position="0 0 0"
           tex="t: grass; rx: 40; ry: 40" color="#ffffff" receive-shadow="true"></a-plane>

  <!-- ============ Calle (carpeta asfáltica) ============ -->
  <a-box width="7" height="0.12" depth="60" position="0 -0.05 0"
         tex="t: asphalt; rx: 3; ry: 30" color="#ffffff" receive-shadow="true"></a-box>

  <!-- Huellas de rodadura (desgaste sutil) -->
  <a-plane rotation="-90 0 0" width="0.95" height="60" position="-1.75 0.02 0" color="#26282c" opacity="0.3" transparent="true"></a-plane>
  <a-plane rotation="-90 0 0" width="0.95" height="60" position="1.75 0.02 0" color="#26282c" opacity="0.3" transparent="true"></a-plane>

  <!-- Raya central doble amarilla -->
  <a-plane rotation="-90 0 0" width="0.07" height="60" position="-0.1 0.03 0" color="#d9a93b"></a-plane>
  <a-plane rotation="-90 0 0" width="0.07" height="60" position="0.1 0.03 0" color="#d9a93b"></a-plane>

  <!-- Rayas de orilla -->
  <a-plane rotation="-90 0 0" width="0.12" height="60" position="-3.32 0.03 0" color="#e8e6df"></a-plane>
  <a-plane rotation="-90 0 0" width="0.12" height="60" position="3.32 0.03 0" color="#e8e6df"></a-plane>

  <!-- Línea de ALTO antes del paso peatonal -->
  <a-plane rotation="-90 0 0" width="3.25" height="0.35" position="-1.78 0.03 -6.8" color="#e8e6df"></a-plane>

  <!-- Tapa de atarjea -->
  <a-circle radius="0.38" rotation="-90 0 0" position="1.6 0.03 -3"
            material="color: #3d4045; metalness: 0.6; roughness: 0.45"></a-circle>
  <a-ring radius-inner="0.38" radius-outer="0.44" rotation="-90 0 0" position="1.6 0.031 -3" color="#2c2f33"></a-ring>

  <!-- ============ Banqueta (lado derecho) ============ -->
  <!-- Guarnición -->
  <a-box width="0.22" height="0.16" depth="60" position="3.61 0.08 0"
         tex="t: concrete; rx: 1; ry: 60" color="#ffffff" receive-shadow="true"></a-box>
  <!-- Loseta -->
  <a-box width="3.9" height="0.15" depth="60" position="5.65 0.075 0"
         tex="t: tiles; rx: 4; ry: 60" color="#ffffff" receive-shadow="true"></a-box>

  <!-- ============ Muro bajo del lado izquierdo ============ -->
  <a-box width="0.25" height="1.4" depth="60" position="-9.7 0.7 0"
         color="#cfc0a8" cast-shadow="true" receive-shadow="true"></a-box>

  <!-- ============ Edificios (fondo derecho) ============ -->
  <a-entity position="8.8 0 -9">
    <a-box width="6" height="9" depth="14" position="0 4.5 0"
           tex="t: brick; rx: 2; ry: 2" color="#ffffff" cast-shadow="true" receive-shadow="true"></a-box>
    <a-plane width="14" height="9" position="-3.01 4.5 0" rotation="0 -90 0"
             tex="t: windows; rx: 7; ry: 4" color="#ffffff"></a-plane>
    <!-- Local con vitrina y toldo -->
    <a-box width="0.06" height="2.2" depth="5" position="-3.06 1.15 0"
           material="color: #2c3a44; roughness: 0.1; metalness: 0.5"></a-box>
    <a-box width="1" height="0.1" depth="4.4" position="-3.45 2.6 0" rotation="0 0 8" color="#a03a2a" cast-shadow="true"></a-box>
  </a-entity>

  <a-entity position="8.8 0 8">
    <a-box width="6" height="7" depth="12" position="0 3.5 0"
           tex="t: brick; rx: 2; ry: 1.5" color="#ffffff" cast-shadow="true" receive-shadow="true"></a-box>
    <a-plane width="12" height="7" position="-3.01 3.5 0" rotation="0 -90 0"
             tex="t: windows; rx: 6; ry: 3" color="#ffffff"></a-plane>
  </a-entity>

  <a-entity position="8.8 0 19">
    <a-box width="6" height="5" depth="8" position="0 2.5 0"
           tex="t: brick; rx: 2; ry: 1.2" color="#ffffff" cast-shadow="true" receive-shadow="true"></a-box>
    <a-plane width="8" height="5" position="-3.01 2.5 0" rotation="0 -90 0"
             tex="t: windows; rx: 4; ry: 2" color="#ffffff"></a-plane>
  </a-entity>

  <!-- Edificio que cierra la calle al fondo -->
  <a-box width="30" height="8" depth="10" position="-2 4 -36"
         tex="t: brick; rx: 5; ry: 2" color="#ffffff" cast-shadow="true" receive-shadow="true"></a-box>

  <!-- ============ Auto estacionado ============ -->
  <a-entity position="-2.3 0 2" cast-shadow="true">
    <a-box width="1.65" height="0.55" depth="3.9" position="0 0.62 0"
           material="color: #3f7fae; roughness: 0.35; metalness: 0.4"></a-box>
    <a-box width="1.5" height="0.5" depth="1.9" position="0 1.12 -0.2"
           material="color: #a9c7de; roughness: 0.1; metalness: 0.6"></a-box>
    <a-box width="1.55" height="0.07" depth="1.7" position="0 1.4 -0.2" color="#3f7fae"></a-box>
    <a-cylinder radius="0.3" height="0.18" rotation="0 0 90" position="-0.78 0.3 1.25" color="#15171a"></a-cylinder>
    <a-cylinder radius="0.3" height="0.18" rotation="0 0 90" position="0.78 0.3 1.25" color="#15171a"></a-cylinder>
    <a-cylinder radius="0.3" height="0.18" rotation="0 0 90" position="-0.78 0.3 -1.25" color="#15171a"></a-cylinder>
    <a-cylinder radius="0.3" height="0.18" rotation="0 0 90" position="0.78 0.3 -1.25" color="#15171a"></a-cylinder>
    <a-box width="0.35" height="0.12" depth="0.05" position="0.55 0.65 1.95" material="color: #fff8d8; emissive: #fff2b0; emissiveIntensity: 0.6"></a-box>
    <a-box width="0.35" height="0.12" depth="0.05" position="-0.55 0.65 1.95" material="color: #fff8d8; emissive: #fff2b0; emissiveIntensity: 0.6"></a-box>
    <a-box width="0.35" height="0.12" depth="0.05" position="0.55 0.65 -1.95" material="color: #c22; emissive: #a00; emissiveIntensity: 0.5"></a-box>
    <a-box width="0.35" height="0.12" depth="0.05" position="-0.55 0.65 -1.95" material="color: #c22; emissive: #a00; emissiveIntensity: 0.5"></a-box>
  </a-entity>

  <!-- ============ Banca ============ -->
  <a-entity position="5.1 0.15 9" rotation="0 -90 0" cast-shadow="true">
    <a-box width="1.8" height="0.05" depth="0.14" position="0 0.45 -0.16" color="#8a5a33"></a-box>
    <a-box width="1.8" height="0.05" depth="0.14" position="0 0.45 0" color="#96653c"></a-box>
    <a-box width="1.8" height="0.05" depth="0.14" position="0 0.45 0.16" color="#8a5a33"></a-box>
    <a-box width="1.8" height="0.16" depth="0.05" position="0 0.75 -0.26" rotation="-10 0 0" color="#96653c"></a-box>
    <a-box width="1.8" height="0.16" depth="0.05" position="0 0.59 -0.26" rotation="-10 0 0" color="#8a5a33"></a-box>
    <a-box width="0.08" height="0.45" depth="0.5" position="-0.8 0.22 0" color="#3a3f45"></a-box>
    <a-box width="0.08" height="0.45" depth="0.5" position="0.8 0.22 0" color="#3a3f45"></a-box>
  </a-entity>

  <!-- ============ Hidrante ============ -->
  <a-entity position="4.05 0.15 -1.5" cast-shadow="true">
    <a-cylinder radius="0.19" height="0.08" position="0 0.04 0" color="#8e1616"></a-cylinder>
    <a-cylinder radius="0.16" height="0.55" position="0 0.32 0" color="#c62828"></a-cylinder>
    <a-sphere radius="0.16" position="0 0.58 0" color="#b71c1c"></a-sphere>
    <a-cylinder radius="0.05" height="0.09" position="0 0.7 0" color="#8e1616"></a-cylinder>
    <a-cylinder radius="0.06" height="0.34" position="0.17 0.34 0" rotation="0 0 90" color="#8e1616"></a-cylinder>
    <a-cylinder radius="0.06" height="0.34" position="-0.17 0.34 0" rotation="0 0 90" color="#8e1616"></a-cylinder>
  </a-entity>

  <!-- ============ Bote de basura ============ -->
  <a-entity position="4.3 0.15 -5" cast-shadow="true">
    <a-cylinder radius="0.28" height="0.75" position="0 0.375 0" color="#2f5d46"></a-cylinder>
    <a-cylinder radius="0.31" height="0.06" position="0 0.75 0" color="#22352c"></a-cylinder>
    <a-cylinder radius="0.24" height="0.02" position="0 0.79 0" color="#111a15"></a-cylinder>
  </a-entity>

  <!-- ============ Nomenclatura de calle ============ -->

    <a-cylinder radius="0.04" height="2.6" position="0 1.3 0" color="#7c8288"></a-cylinder>
    <a-box width="1.3" height="0.32" depth="0.04" position="0 2.35 0" color="#1c4f9c"></a-box>

    <a-box width="1.4" height="0.08" depth="0.08" position="-0.7 3.3 0" color="#2e3338"></a-box>
    <a-box width="0.28" height="0.85" depth="0.22" position="-1.35 2.95 0" color="#22262a"></a-box>
    <a-sphere radius="0.075" position="-1.35 3.2 0.13" material="color: #ff5148; emissive: #ff3b30; emissiveIntensity: 1"></a-sphere>
    <a-sphere radius="0.075" position="-1.35 2.98 0.13" material="color: #3a3410"></a-sphere>
    <a-sphere radius="0.075" position="-1.35 2.76 0.13" material="color: #103a1c"></a-sphere>
  </a-entity>

  <!-- ============ Jugador ============ -->
  <a-entity id="rig" position="4.6 0.15 12" rotation="0 15 0">
    <a-entity camera position="0 1.65 0"
              look-controls="pointerLockEnabled: false"
              wasd-controls="acceleration: 18"></a-entity>
  </a-entity>

</a-scene>
</body>
